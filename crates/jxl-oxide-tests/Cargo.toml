[package]
name = "jxl-oxide-tests"
description = "jxl-oxide integration tests"
repository = "https://github.com/tirr-c/jxl-oxide.git"
readme = "README.md"
license = "MIT OR Apache-2.0"

version = "0.0.0"
edition = "2024"

[dependencies]
tracing.workspace = true

[dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["blocking", "rustls"]
optional = true

[dev-dependencies]
criterion = "0.5.1"
mimalloc = "0.1.39"
ring = "0.17.8"
zstd = "0.14.5"

[dev-dependencies.image]
version = "0.25.4"
default-features = false

[dev-dependencies.jxl-oxide]
version = "0.12.0"
path = "../jxl-oxide"
default-features = false
features = ["lcms2", "moxcms", "image"]

[dev-dependencies.rand]
version = "0.10.1"
default-features = false
features = ["sys_rng"]

[dev-dependencies.ssimulacra2]
version = "0.5.1"
default-features = false

[features]
default = ["net", "rayon"]
net = ["dep:reqwest"]
rayon = ["jxl-oxide/rayon", "ssimulacra2/rayon"]

[[bench]]
name = "decode"
harness = false
